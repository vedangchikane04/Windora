services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: windora-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DEFAULT_CUTOFF_TIME=11:00
      - DEFAULT_MATCHING_MODE=hour_block
      - ELEXON_BASE_URL=https://data.elexon.co.uk/bmrs/api/v1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: windora-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    name: windora-network
